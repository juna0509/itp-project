<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Match - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      width: 100%;
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      font-size: 16px;
      user-select: none;
      z-index: 10;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <main class="auth-main">
    <!-- Back Button -->
    <a href="welcomepage.html" class="back-btn">&larr;</a>

    <!-- Header Logo -->
    <div class="auth-header">
      <h1 class="auth-logo">PERFECT MATCH</h1>
      <div class="divider-line">✦</div>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="loginForm">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required autofocus>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-password" id="togglePasswordBtn" title="Show/Hide Password">👁</button>
        </div>
      </div>

      <div class="form-actions">
        <a href="#" class="forgot-pass">Forgot Password?</a>
      </div>

      <button type="submit" class="auth-btn">LOGIN</button>
    </form>

    <!-- Footer / Signup Link -->
    <div class="auth-footer">
      <div class="or-divider">OR</div>
      <p>Don't have an account? <a href="signup.html">Register</a></p>
    </div>
  </main>

  <!-- Script for Toggle Password Eye -->
  <script>
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    togglePasswordBtn.addEventListener("click", () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePasswordBtn.textContent = "🙈";
      } else {
        passwordInput.type = "password";
        togglePasswordBtn.textContent = "👁";
      }
    });
  </script>

  <!-- Firebase Login & Role Check Script -->
  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore();
    const loginForm = document.getElementById("loginForm");
    const submitBtn = loginForm.querySelector("button[type='submit']");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.innerText = "LOGGING IN...";
      submitBtn.disabled = true;

      try {
        // 1. Authenticate with Firebase Auth
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // 2. Check user role in Firestore database
        const userDocRef = doc(db, "users", user.uid);
        const userDoc = await getDoc(userDocRef);

        if (userDoc.exists()) {
          const userData = userDoc.data();
          const role = userData.role;

          if (role === "admin") {
            window.location.href = "admindashboard.html";
          } else {
            // Default for customer or any other role
            window.location.href = "searchpage.html";
          }
        } else {
          // If document doesn't exist, fallback to customer search page
          window.location.href = "searchpage.html";
        }

      } catch (error) {
        console.error("Login Error:", error);

        if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-email') {
          alert("The email or password you entered is incorrect. Please check your details and try again.");
        } else {
          alert("Failed to log in: " + error.message);
        }

        submitBtn.innerText = "LOGIN";
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
