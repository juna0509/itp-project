<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Match - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-main">
    <!-- Butang Kembali ke Welcome Page -->
    <a href="welcomepage.html" class="back-btn">&larr;</a>

    <!-- Header Logo -->
    <div class="auth-header">
      <h1 class="auth-logo">PERFECT MATCH</h1>
      <div class="divider-line">✦</div>
    </div>

    <!-- Form Log Masuk -->
    <form class="auth-form" id="loginForm">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="form-actions">
        <a href="#" class="forgot-pass">Forgot Password?</a>
      </div>

      <button type="submit" class="auth-btn">LOGIN</button>
    </form>

    <!-- Pembahagi & Pautan Daftar -->
    <div class="auth-footer">
      <div class="or-divider">OR</div>
      <p>Don't have an account? <a href="signup.html">Register</a></p>
    </div>
  </main>

  <!-- Script Firebase Login -->
  <script type="module">
  import { auth } from "./firebase.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const loginForm = document.getElementById("loginForm");
  const submitBtn = loginForm.querySelector("button[type='submit']");

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    submitBtn.innerText = "LOGGING IN...";
    submitBtn.disabled = true;

    try {
      // 1. Sahkan log masuk dengan Firebase Auth
      await signInWithEmailAndPassword(auth, email, password);

      // 2. TERUS TERIMA DAN PINDAH KE SEARCH PAGE
      window.location.href = "searchpage.html";

    } catch (error) {
      console.error("Login Error:", error);

      if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
        alert("The email or password you entered is incorrect. Please check your details and try again.");
      } else {
        alert("Failed to log in: " + error.message);
      }

      submitBtn.innerText = "LOGIN";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
