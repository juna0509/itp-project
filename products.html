    uploadBtn.addEventListener("click", async () => {
      statusText.innerText = "Uploading products... Please wait...";
      try {
        const productsRef = collection(db, "products");
        let count = 0;
        for (const product of sampleProducts) {
          await addDoc(productsRef, product);
          count++;
          statusText.innerText = `Uploaded ${count} of ${sampleProducts.length} products...`;
        }
        statusText.innerText = `✅ SUCCESS! All ${sampleProducts.length} products uploaded successfully!`;
      } catch (error) {
        console.error("Upload failed:", error);
        statusText.innerText = "❌ Failed: " + error.message;
      }
    });
