<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Match - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #12100e;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding-bottom: 50px;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Tajuk Halaman Mengikut Tema Pelanggan */
    .profile-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .profile-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: #d4af37;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .profile-header p {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Susunan Tab Menu Atas Mengikut Urutan Baru */
    .admin-top-nav {
      display: flex;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow-x: auto;
    }

    .admin-nav-tab {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .admin-nav-tab:hover, .admin-nav-tab.active {
      background: #d4af37;
      color: #1a1a1a;
      font-weight: 600;
    }

    /* Kad Borang & Panel Kandungan */
    .auth-form {
      background: #1a1714;
      border: 1px solid rgba(215, 175, 55, 0.25);
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: #d4af37;
      margin-bottom: 18px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    /* Medan Input, Dropdown & Borang */
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.5);
      display: block;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      box-sizing: border-box;
    }
    .form-group select option {
      background-color: #1a1714;
      color: #fff;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: #d4af37;
    }
    .form-group input::placeholder, .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    /* Ruangan Kata Laluan dengan Ikon Mata */
    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      font-size: 15px;
      background: none;
      border: none;
      color: #aaa;
    }

    /* Butang Eksklusif Tema Emas */
    .update-pass-btn, .admin-primary-btn {
      background-color: #d4af37;
      color: #1a1a1a;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
      font-family: 'Montserrat', sans-serif;
    }
    .update-pass-btn:hover, .admin-primary-btn:hover {
      background-color: #e6c55c;
    }

    /* Butang Logout Gaya Pelanggan */
    .logout-btn {
      background: rgba(217, 83, 79, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(217, 83, 79, 0.4);
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
      transition: all 0.2s;
    }
    .logout-btn:hover {
      background: #d9534f;
      color: #fff;
    }

    /* Jadual Data (Tables) */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: left;
    }
    .admin-table th {
      background: rgba(212, 175, 55, 0.15);
      color: #d4af37;
      padding: 10px;
      font-weight: 600;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }
    .admin-table td {
      padding: 11px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
    }
    .admin-table img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .action-del-btn {
      background: rgba(217, 83, 79, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(217, 83, 79, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }
    .action-del-btn:hover {
      background: #d9534f;
      color: #fff;
    }

    /* System Alert Modal (Sempurna Sama Pelanggan) */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .popup-box {
      background: #1e1b18;
      border: 1px solid rgba(215, 175, 55, 0.3);
      border-radius: 10px;
      width: 85%;
      max-width: 330px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      overflow: hidden;
    }
    .popup-overlay.show .popup-box {
      transform: translateY(0);
    }
    .popup-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }
    .popup-system-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
    }
    .popup-close-x {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
      cursor: pointer;
    }
    .popup-body-content {
      padding: 24px 20px;
      text-align: center;
    }
    .popup-icon-container {
      margin-bottom: 15px;
      color: #e6c55c;
      display: flex;
      justify-content: center;
    }
    .popup-message {
      font-size: 13px;
      color: #e0e0e0;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .popup-btn {
      background-color: #d4af37;
      color: #1a1a1a;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="profile-header">
      <h2>ADMIN DASHBOARD</h2>
      <p>SYSTEM MANAGEMENT PANEL</p>
    </div>

    <!-- Susunan Tab Mengikut Urutan: Add Product, All Product, Users, Settings -->
    <div class="admin-top-nav">
      <button class="admin-nav-tab active" data-target="addProductPanel">Add Product</button>
      <button class="admin-nav-tab" data-target="manageProductsPanel">All Product</button>
      <button class="admin-nav-tab" data-target="manageUsersPanel">Users</button>
      <button class="admin-nav-tab" data-target="settingsPanel">Settings</button>
    </div>

    <!-- PANEL 1: ADD PRODUCT -->
    <div class="auth-form active" id="addProductPanel">
      <div class="panel-title">Add New Product</div>
      <form id="addProductForm">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="prodName" placeholder="e.g. Fit Me Matte + Poreless" required>
        </div>

        <div class="form-group">
          <label>Product Image File</label>
          <input type="file" id="prodImageFile" accept="image/*" required>
          <small style="color: rgba(255,255,255,0.4); font-size: 11px;">Select image from your device (JPG, PNG)</small>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="prodCategory" required>
            <option value="">Select category</option>
            <option value="Foundation">Foundation</option>
            <option value="Concealer">Concealer</option>
            <option value="Blush">Blush</option>
            <option value="Lipstick">Lipstick</option>
            <option value="Eyeshadow">Eyeshadow</option>
            <option value="Bronzer">Bronzer</option>
            <option value="Contour">Contour</option>
            <option value="Cushion Foundation">Cushion Foundation</option>
            <option value="Loose Powder">Loose Powder</option>
            <option value="Highlighter">Highlighter</option>
            <option value="Setting Spray">Setting Spray</option>
            <option value="Compact Powder">Compact Powder</option>
            <option value="Primer">Primer</option>
          </select>
        </div>

        <div class="form-group">
          <label>Level / Grade</label>
          <select id="prodLevel" required>
            <option value="">Select level</option>
            <option value="Local">Local</option>
            <option value="Drugstore">Drugstore</option>
            <option value="High End">High End</option>
          </select>
        </div>

        <div class="form-group">
          <label>Skin Type</label>
          <select id="prodSkinType" required>
            <option value="">Select skin type</option>
            <option value="Oily">Oily</option>
            <option value="Dry">Dry</option>
            <option value="Combination">Combination</option>
            <option value="Normal">Normal</option>
            <option value="Sensitive">Sensitive</option>
          </select>
        </div>

        <div class="form-group">
          <label>Coverage</label>
          <select id="prodCoverage" required>
            <option value="">Select coverage</option>
            <option value="Full">Full</option>
            <option value="Medium">Medium</option>
            <option value="Medium to Full">Medium to Full</option>
          </select>
        </div>

        <div class="form-group">
          <label>Shade / Tone</label>
          <input type="text" id="prodShade" placeholder="e.g. 120 Classic Ivory" required>
        </div>

        <div class="form-group">
          <label>Price (MYR)</label>
          <input type="number" step="0.01" id="prodPrice" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label>Key Ingredients</label>
          <textarea id="prodIngredients" rows="2" placeholder="e.g. Niacinamide, Hyaluronic Acid" required></textarea>
        </div>

        <button type="submit" class="admin-primary-btn" id="saveProdBtn">Publish Product</button>
      </form>
    </div>

    <!-- PANEL 2: ALL PRODUCT (Manage Products) -->
    <div class="auth-form" id="manageProductsPanel">
      <div class="panel-title">All Product Catalog</div>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="4" style="text-align: center; color: #888;">Loading catalog...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- PANEL 3: USERS (Manage Users - Tanpa Admin) -->
    <div class="auth-form" id="manageUsersPanel">
      <div class="panel-title">Registered Customers</div>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Email Address</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="3" style="text-align: center; color: #888;">Loading customers...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- PANEL 4: SETTINGS (Paling Terakhir) -->
    <div class="auth-form" id="settingsPanel">
      <div class="panel-title">Admin Settings</div>
      
      <div class="form-group">
        <label>Admin Email</label>
        <input type="text" id="adminEmailDisplay" readonly style="background: rgba(255,255,255,0.02); color: #aaa;">
      </div>

      <div style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 15px;">
        <h4 style="font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #fff;">Change Password</h4>
        
        <div class="form-group">
          <label>Current Password</label>
          <div class="password-wrapper">
            <input type="password" id="adminCurrentPass" placeholder="Current password">
            <button type="button" class="toggle-password" id="toggleCurrentBtn">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label>New Password</label>
          <div class="password-wrapper">
            <input type="password" id="adminNewPass" placeholder="New password">
            <button type="button" class="toggle-password" id="toggleNewBtn">👁</button>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="password-wrapper">
            <input type="password" id="adminConfirmPass" placeholder="Confirm new password">
            <button type="button" class="toggle-password" id="toggleConfirmBtn">👁</button>
          </div>
        </div>

        <button type="button" class="update-pass-btn" id="updateAdminPassBtn">Update Password</button>
      </div>

      <button class="logout-btn" id="adminLogoutBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>LOG OUT</span>
      </button>
    </div>

  </div>

  <!-- Custom System Alert Modal -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-header-bar">
        <span class="popup-system-title" id="popupTitle">SYSTEM ALERT</span>
        <button class="popup-close-x" id="popupCloseXBtn">&times;</button>
      </div>
      <div class="popup-body-content">
        <div class="popup-icon-container">
          <svg viewBox="0 0 24 24" width="38" height="38" stroke="currentColor" stroke-width="1.8" fill="none">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <p class="popup-message" id="popupMessage">Mesej ralat.</p>
        <button class="popup-btn" id="popupCloseBtn">OK</button>
      </div>
    </div>
  </div>

  <!-- Skrip JavaScript Firestore & Logik -->
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, getDocs, addDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Modals Popup
    const popupOverlay = document.getElementById("popupOverlay");
    const popupTitle = document.getElementById("popupTitle");
    const popupMessage = document.getElementById("popupMessage");
    const popupCloseBtn = document.getElementById("popupCloseBtn");
    const popupCloseXBtn = document.getElementById("popupCloseXBtn");

    function showAlert(title, message) {
      popupTitle.textContent = title;
      popupMessage.textContent = message;
      popupOverlay.classList.add("show");
    }
    popupCloseBtn.addEventListener("click", () => popupOverlay.classList.remove("show"));
    popupCloseXBtn.addEventListener("click", () => popupOverlay.classList.remove("show"));

    // Tukar Tab Menu Atas
    const navTabs = document.querySelectorAll(".admin-nav-tab");
    const forms = document.querySelectorAll(".auth-form");

    navTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        navTabs.forEach(t => t.classList.remove("active"));
        forms.forEach(f => f.classList.remove("active"));
        
        tab.classList.add("active");
        document.getElementById(tab.getAttribute("data-target")).classList.add("active");
      });
    });

    // Toggle Mata Password
    function setupToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      btn.addEventListener("click", () => {
        if (input.type === "password") {
          input.type = "text";
          btn.textContent = "🙈";
        } else {
          input.type = "password";
          btn.textContent = "👁";
        }
      });
    }
    setupToggle("toggleCurrentBtn", "adminCurrentPass");
    setupToggle("toggleNewBtn", "adminNewPass");
    setupToggle("toggleConfirmBtn", "adminConfirmPass");

    // Tukar Fail Imej kepada Base64
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
      });
    }

    // Semak Auth Admin & Muat Data
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "loginpage.html";
      } else {
        document.getElementById("adminEmailDisplay").value = user.email;
        loadProducts();
        loadUsers();
      }
    });

    // Muat Senarai Produk
    async function loadProducts() {
      const tbody = document.getElementById("productsTableBody");
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        tbody.innerHTML = "";
        if (querySnapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888;">No products found.</td></tr>`;
          return;
        }
        querySnapshot.forEach((docSnap) => {
          const prod = docSnap.data();
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><img src="${prod.productImage || prod.image || 'https://via.placeholder.com/40'}" alt="prod"></td>
            <td>${prod.productName || prod.name || 'Unnamed'}</td>
            <td>${prod.category || 'N/A'}</td>
            <td><button class="action-del-btn" data-id="${docSnap.id}">Delete</button></td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll(".action-del-btn").forEach(button => {
          button.addEventListener("click", async (e) => {
            const id = e.target.getAttribute("data-id");
            if (confirm("Are you sure you want to delete this product?")) {
              await deleteDoc(doc(db, "products", id));
              loadProducts();
            }
          });
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Tambah Produk dari Peranti (Base64)
    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const imageInput = document.getElementById("prodImageFile");
      const file = imageInput.files[0];

      if (!file) {
        showAlert("SYSTEM ALERT", "Please select a product image file.");
        return;
      }

      const saveBtn = document.getElementById("saveProdBtn");
      saveBtn.innerText = "PROCESSING...";
      saveBtn.disabled = true;

      try {
        const base64Image = await convertFileToBase64(file);

        await addDoc(collection(db, "products"), {
          productName: document.getElementById("prodName").value,
          productImage: base64Image,
          category: document.getElementById("prodCategory").value,
          level: document.getElementById("prodLevel").value,
          skinType: document.getElementById("prodSkinType").value,
          coverage: document.getElementById("prodCoverage").value,
          shade: document.getElementById("prodShade").value,
          price: parseFloat(document.getElementById("prodPrice").value),
          keyIngredients: document.getElementById("prodIngredients").value,
          createdAt: serverTimestamp()
        });

        showAlert("SUCCESS", "New product published successfully!");
        document.getElementById("addProductForm").reset();
        loadProducts();
      } catch (err) {
        showAlert("SYSTEM ALERT", "Failed to add product: " + err.message);
      } finally {
        saveBtn.innerText = "Publish Product";
        saveBtn.disabled = false;
      }
    });

    // Muat Senarai Pelanggan Sahaja (Tapis Keluar Admin)
    async function loadUsers() {
      const tbody = document.getElementById("usersTableBody");
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        tbody.innerHTML = "";
        
        let customerCount = 0;
        querySnapshot.forEach((docSnap) => {
          const userDat = docSnap.data();
          if (userDat.role !== 'admin' && userDat.email !== "admin@gmail.com") {
            customerCount++;
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${userDat.fullName || userDat.name || 'Customer'}</td>
              <td>${userDat.email || 'N/A'}</td>
              <td><button class="action-del-btn" data-userid="${docSnap.id}">Remove</button></td>
            `;
            tbody.appendChild(tr);
          }
        });

        if (customerCount === 0) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">No registered customers found.</td></tr>`;
          return;
        }

        document.querySelectorAll("[data-userid]").forEach(button => {
          button.addEventListener("click", async (e) => {
            const uid = e.target.getAttribute("data-userid");
            if (confirm("Remove this customer record?")) {
              await deleteDoc(doc(db, "users", uid));
              loadUsers();
            }
          });
        });
      } catch (err) {
        console.error(err);
      }
    }

    // Kemas Kini Kata Laluan Admin dengan Re-authentication
    document.getElementById("updateAdminPassBtn").addEventListener("click", async () => {
      const user = auth.currentUser;
      const currentPass = document.getElementById("adminCurrentPass").value;
      const newPass = document.getElementById("adminNewPass").value;
      const confirmPass = document.getElementById("adminConfirmPass").value;

      if (!currentPass || !newPass || !confirmPass) {
        showAlert("SYSTEM ALERT", "Please fill in all password fields.");
        return;
      }

      if (newPass !== confirmPass) {
        showAlert("SYSTEM ALERT", "New passwords do not match.");
        return;
      }

      if (newPass.length < 6) {
        showAlert("SYSTEM ALERT", "New password must be at least 6 characters long.");
        return;
      }

      try {
        const credential = EmailAuthProvider.credential(user.email, currentPass);
        await reauthenticateWithCredential(user, credential);
        await updatePassword(user, newPass);

        showAlert("SUCCESS", "Admin password updated successfully!");
        document.getElementById("adminCurrentPass").value = "";
        document.getElementById("adminNewPass").value = "";
        document.getElementById("adminConfirmPass").value = "";
      } catch (err) {
        console.error(err);
        if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          showAlert("SYSTEM ALERT", "The current password you entered is incorrect.");
        } else {
          showAlert("SYSTEM ALERT", "Failed to update password: " + err.message);
        }
      }
    });

    // Logout
    document.getElementById("adminLogoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("loginpage.html");
      } catch (error) {
        console.error(error);
      }
    });
  </script>
</body>
</html>
