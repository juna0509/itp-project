<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Match - Profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Stail tambahan untuk bahagian tukar katalaluan & ikon mata */
    .password-section {
      margin-top: 15px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding-top: 15px;
    }
    .password-section h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }
    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    .password-wrapper input {
      width: 100%;
      padding: 8px 40px 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      font-size: 16px;
      user-select: none;
      z-index: 10;
      background: none;
      border: none;
    }
    .update-pass-btn {
      background-color: #222;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .update-pass-btn:hover {
      background-color: #444;
    }

    /* Stail untuk Pop-up Notification / Modal */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .popup-box {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    .popup-overlay.show .popup-box {
      transform: translateY(0);
    }
    .popup-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .popup-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111;
    }
    .popup-message {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .popup-btn {
      background-color: #222;
      color: #fff;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .popup-btn:hover {
      background-color: #444;
    }
  </style>
</head>
<body>

  <div class="app-container profile-main">
    
    <div class="profile-header">
      <h2>PROFILE</h2>
      <p>YOUR PERSONAL SANCTUARY</p>
    </div>

    <div class="auth-form account-card">
      <div class="avatar-container">
        <svg class="profile-avatar-icon" viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="account-details">
        <div class="detail-item">
          <label>Full Name</label>
          <span id="userFullName">User</span>
        </div>
        <div class="detail-item">
          <label>Email</label>
          <span id="userEmail">loading...</span>
        </div>

        <!-- Bahagian Tukar / Reset Kata Laluan -->
        <div class="password-section">
          <h4>Change Password</h4>
          
          <div class="password-wrapper">
            <input type="password" id="newPassword" placeholder="Enter new password">
            <button type="button" class="toggle-password" id="toggleNewPassBtn" title="Show/Hide Password">👁</button>
          </div>

          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
            <button type="button" class="toggle-password" id="toggleConfirmPassBtn" title="Show/Hide Password">👁</button>
          </div>

          <button type="button" class="update-pass-btn" id="updatePasswordBtn">Update Password</button>
        </div>
      </div>
    </div>

    <a href="skinprofile.html" class="action-card-link">
      <div class="auth-form action-card">
        <div class="action-card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="action-card-text">
          <h4>Skin Profile</h4>
          <p>Tell us about your skin to get better matches.</p>
        </div>
        <span class="chevron">&rsaquo;</span>
      </div>
    </a>

    <a href="recommendationpage.html" class="action-card-link">
      <div class="auth-form action-card">
        <div class="action-card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="action-card-text">
          <h4>View Recommendations</h4>
          <p>See personalized product recommendations for you.</p>
        </div>
        <span class="chevron">&rsaquo;</span>
      </div>
    </a>

    <div class="account-actions">
      <button class="logout-btn" id="logoutBtn">
        <svg class="logout-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>LOG OUT</span>
      </button>
    </div>

  </div>

  <!-- Custom Pop-up Modal HTML -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-icon" id="popupIcon">✨</div>
      <h3 class="popup-title" id="popupTitle">Success</h3>
      <p class="popup-message" id="popupMessage">Your action was completed successfully.</p>
      <button class="popup-btn" id="popupCloseBtn">OK</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="searchpage.html" class="nav-item">
      <svg class="search-svg-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search</span>
    </a>
    <a href="comparisonpage.html" class="nav-item">
      <span class="nav-icon transparent-emoji">⚖️</span>
      <span>Compare</span>
    </a>
    <a href="profilepage.html" class="nav-item active">
      <span class="nav-icon transparent-emoji">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const userEmail = document.getElementById("userEmail");
    const userFullName = document.getElementById("userFullName");
    const logoutBtn = document.getElementById("logoutBtn");

    // Elemen Tukar Kata Laluan
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const updatePasswordBtn = document.getElementById("updatePasswordBtn");
    const toggleNewPassBtn = document.getElementById("toggleNewPassBtn");
    const toggleConfirmPassBtn = document.getElementById("toggleConfirmPassBtn");

    // Elemen Pop-up
    const popupOverlay = document.getElementById("popupOverlay");
    const popupIcon = document.getElementById("popupIcon");
    const popupTitle = document.getElementById("popupTitle");
    const popupMessage = document.getElementById("popupMessage");
    const popupCloseBtn = document.getElementById("popupCloseBtn");

    function showPopup(title, message, icon = "✨") {
      popupTitle.textContent = title;
      popupMessage.textContent = message;
      popupIcon.textContent = icon;
      popupOverlay.classList.add("show");
    }

    popupCloseBtn.addEventListener("click", () => {
      popupOverlay.classList.remove("show");
    });

    // Toggle Ikon Mata untuk New Password
    toggleNewPassBtn.addEventListener("click", () => {
      if (newPasswordInput.type === "password") {
        newPasswordInput.type = "text";
        toggleNewPassBtn.textContent = "🙈";
      } else {
        newPasswordInput.type = "password";
        toggleNewPassBtn.textContent = "👁";
      }
    });

    // Toggle Ikon Mata untuk Confirm Password
    toggleConfirmPassBtn.addEventListener("click", () => {
      if (confirmPasswordInput.type === "password") {
        confirmPasswordInput.type = "text";
        toggleConfirmPassBtn.textContent = "🙈";
      } else {
        confirmPasswordInput.type = "password";
        toggleConfirmPassBtn.textContent = "👁";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "loginpage.html";
      } else {
        userEmail.innerText = user.email;
        userFullName.innerText = user.displayName || user.email.split('@')[0];

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            userFullName.innerText = data.fullName || data.nickname || user.email.split('@')[0];
          } else {
            userFullName.innerText = user.email.split('@')[0];
          }
        } catch (error) {
          console.error("Error fetching profile:", error);
          userFullName.innerText = user.email.split('@')[0];
        }
      }
    });

    // Fungsi Kemas Kini Kata Laluan
    updatePasswordBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!newPassword || !confirmPassword) {
        showPopup("Missing Fields", "Please fill in both password fields.", "⚠️");
        return;
      }

      if (newPassword !== confirmPassword) {
        showPopup("Mismatch", "Passwords do not match. Please check again.", "⚠️");
        return;
      }

      if (newPassword.length < 6) {
        showPopup("Too Short", "Password should be at least 6 characters long.", "⚠️");
        return;
      }

      try {
        updatePasswordBtn.innerText = "UPDATING...";
        updatePasswordBtn.disabled = true;

        await updatePassword(user, newPassword);
        
        // Pop-up Berjaya
        showPopup("Success!", "Your password has been updated successfully.", "🎉");
        
        // Kosongkan ruangan input
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";
      } catch (error) {
        console.error("Error updating password:", error);
        if (error.code === 'auth/requires-recent-login') {
          showPopup("Security Check", "For security reasons, please log out and log back in before changing your password.", "🔒");
        } else {
          showPopup("Error", "Failed to update password: " + error.message, "❌");
        }
      } finally {
        updatePasswordBtn.innerText = "Update Password";
        updatePasswordBtn.disabled = false;
      }
    });

    // Tetapan butang Log Out
    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("loginpage.html");
      } catch (error) {
        console.error("Logout Error:", error);
      }
    });
  </script>
</body>
</html>
