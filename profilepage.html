<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Match - Profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container profile-main">
    
    <div class="profile-header">
      <h2>PROFILE</h2>
      <p>YOUR PERSONAL SANCTUARY</p>
    </div>

    <div class="auth-form account-card">
      <div class="avatar-container">
        <svg class="profile-avatar-icon" viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="account-details">
        <div class="detail-item">
          <label>Full Name</label>
          <span id="userFullName">User</span>
        </div>
        <div class="detail-item">
          <label>Email</label>
          <span id="userEmail">loading...</span>
        </div>
      </div>
    </div>

    <a href="skinprofile.html" class="action-card-link">
      <div class="auth-form action-card">
        <div class="action-card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="action-card-text">
          <h4>Skin Profile</h4>
          <p>Tell us about your skin to get better matches.</p>
        </div>
        <span class="chevron">&rsaquo;</span>
      </div>
    </a>

    <a href="recommendationpage.html" class="action-card-link">
      <div class="auth-form action-card">
        <div class="action-card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="action-card-text">
          <h4>View Recommendations</h4>
          <p>See personalized product recommendations for you.</p>
        </div>
        <span class="chevron">&rsaquo;</span>
      </div>
    </a>

    <div class="account-actions">
      <button class="logout-btn" id="logoutBtn">
        <svg class="logout-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>LOG OUT</span>
      </button>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="searchpage.html" class="nav-item">
      <svg class="search-svg-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search</span>
    </a>
    <a href="comparisonpage.html" class="nav-item">
      <span class="nav-icon transparent-emoji">⚖️</span>
      <span>Compare</span>
    </a>
    <a href="profilepage.html" class="nav-item active">
      <span class="nav-icon transparent-emoji">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const userEmail = document.getElementById("userEmail");
    const userFullName = document.getElementById("userFullName");
    const logoutBtn = document.getElementById("logoutBtn");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // Hantar ke loginpage.html jika tiada sesi aktif
        window.location.href = "loginpage.html";
      } else {
        userEmail.innerText = user.email;
        userFullName.innerText = user.displayName || user.email.split('@')[0];

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          
          if (userDoc.exists()) {
            const data = userDoc.data();
            // Semak fullName dahulu, kemudian nickname, atau ambil nama sebelum @ dari emel
            userFullName.innerText = data.fullName || data.nickname || user.email.split('@')[0];
          } else {
            userFullName.innerText = user.email.split('@')[0];
          }
        } catch (error) {
          console.error("Error fetching profile:", error);
          userFullName.innerText = user.email.split('@')[0];
        }
      }
    });

    // Tetapan butang Log Out
    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("loginpage.html");
      } catch (error) {
        console.error("Logout Error:", error);
      }
    });
  </script>
</body>
</html>
