<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Match - Profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Kad Profil Utama: Susunan Menegak */
    .profile-card-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 20px;
      gap: 20px;
    }

    .profile-identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .avatar-container-center {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px solid rgba(215, 175, 55, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 12px;
    }

    .profile-avatar-icon {
      color: #d4af37;
    }

    .profile-identity .detail-item {
      margin-bottom: 10px;
      width: 100%;
    }

    .profile-identity label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.5);
      display: block;
      margin-bottom: 2px;
    }

    .profile-identity span {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
    }

    /* Bahagian Tukar Kata Laluan */
    .password-section {
      width: 100%;
      text-align: left;
    }

    .password-section h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .password-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      box-sizing: border-box;
    }

    .password-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .password-wrapper input:focus {
      outline: none;
      border-color: #d4af37;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      font-size: 15px;
      user-select: none;
      z-index: 10;
      background: none;
      border: none;
      color: #aaa;
    }

    .update-pass-btn {
      background-color: #d4af37;
      color: #1a1a1a;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
    }

    .update-pass-btn:hover {
      background-color: #e6c55c;
    }

    /* --- STAIR POP-UP MODAL (GAYA SYSTEM ALERT) --- */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .popup-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .popup-box {
      background: #1e1b18; /* Warna latar gelap tema aplikasi */
      border: 1px solid rgba(215, 175, 55, 0.3);
      border-radius: 10px;
      width: 85%;
      max-width: 330px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }
    .popup-overlay.show .popup-box {
      transform: translateY(0);
    }
    /* Bahagian Atas (Header) Alert */
    .popup-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }
    .popup-system-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
    }
    .popup-close-x {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
      cursor: pointer;
    }
    .popup-close-x:hover {
      color: #fff;
    }
    /* Kandungan Badan Alert */
    .popup-body-content {
      padding: 24px 20px;
      text-align: center;
    }
    .popup-icon-container {
      margin-bottom: 15px;
      color: #e6c55c; /* Warna kuning amaran */
      display: flex;
      justify-content: center;
    }
    .popup-message {
      font-size: 13px;
      color: #e0e0e0;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .popup-btn {
      background-color: #d4af37;
      color: #1a1a1a;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .popup-btn:hover {
      background-color: #e6c55c;
    }
  </style>
</head>
<body>

  <div class="app-container profile-main">
    
    <div class="profile-header">
      <h2>PROFILE</h2>
      <p>YOUR PERSONAL SANCTUARY</p>
    </div>

    <!-- Kad Profil Utama -->
    <div class="auth-form profile-card-main">
      
      <div class="profile-identity">
        <div class="avatar-container-center">
          <svg class="profile-avatar-icon" viewBox="0 0 24 24" width="34" height="34" stroke="currentColor" stroke-width="1.5" fill="none">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="detail-item">
          <label>Full Name</label>
          <span id="userFullName">User</span>
        </div>
        <div class="detail-item" style="margin-bottom: 0;">
          <label>Email</label>
          <span id="userEmail">loading...</span>
        </div>
      </div>

      <!-- Bahagian Tukar Kata Laluan -->
      <div class="password-section">
        <h4>Change Password</h4>
        
        <div class="password-wrapper">
          <input type="password" id="currentPassword" placeholder="Current password">
          <button type="button" class="toggle-password" id="toggleCurrentPassBtn" title="Show/Hide Password">👁</button>
        </div>

        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="New password">
          <button type="button" class="toggle-password" id="toggleNewPassBtn" title="Show/Hide Password">👁</button>
        </div>

        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm new password">
          <button type="button" class="toggle-password" id="toggleConfirmPassBtn" title="Show/Hide Password">👁</button>
        </div>

        <button type="button" class="update-pass-btn" id="updatePasswordBtn">Update Password</button>
      </div>

    </div>

    <a href="skinprofile.html" class="action-card-link">
      <div class="auth-form action-card">
        <div class="action-card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="action-card-text">
          <h4>Skin Profile</h4>
          <p>Tell us about your skin to get better matches.</p>
        </div>
        <span class="chevron">&rsaquo;</span>
      </div>
    </a>

    <a href="recommendationpage.html" class="action-card-link">
      <div class="auth-form action-card">
        <div class="action-card-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.8" fill="none">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        </div>
        <div class="action-card-text">
          <h4>View Recommendations</h4>
          <p>See personalized product recommendations for you.</p>
        </div>
        <span class="chevron">&rsaquo;</span>
      </div>
    </a>

    <div class="account-actions">
      <button class="logout-btn" id="logoutBtn">
        <svg class="logout-icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>LOG OUT</span>
      </button>
    </div>

  </div>

  <!-- Custom Pop-up Modal HTML (Gaya System Alert) -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-header-bar">
        <span class="popup-system-title" id="popupTitle">SYSTEM ALERT</span>
        <button class="popup-close-x" id="popupCloseXBtn">&times;</button>
      </div>
      <div class="popup-body-content">
        <div class="popup-icon-container">
          <!-- Icon Amaran Segitiga -->
          <svg viewBox="0 0 24 24" width="38" height="38" stroke="currentColor" stroke-width="1.8" fill="none">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <p class="popup-message" id="popupMessage">Mesej amaran akan dipaparkan di sini.</p>
        <button class="popup-btn" id="popupCloseBtn">OK</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="searchpage.html" class="nav-item">
      <svg class="search-svg-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search</span>
    </a>
    <a href="comparisonpage.html" class="nav-item">
      <span class="nav-icon transparent-emoji">⚖️</span>
      <span>Compare</span>
    </a>
    <a href="profilepage.html" class="nav-item active">
      <span class="nav-icon transparent-emoji">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const userEmail = document.getElementById("userEmail");
    const userFullName = document.getElementById("userFullName");
    const logoutBtn = document.getElementById("logoutBtn");

    const currentPasswordInput = document.getElementById("currentPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const updatePasswordBtn = document.getElementById("updatePasswordBtn");
    
    const toggleCurrentPassBtn = document.getElementById("toggleCurrentPassBtn");
    const toggleNewPassBtn = document.getElementById("toggleNewPassBtn");
    const toggleConfirmPassBtn = document.getElementById("toggleConfirmPassBtn");

    const popupOverlay = document.getElementById("popupOverlay");
    const popupTitle = document.getElementById("popupTitle");
    const popupMessage = document.getElementById("popupMessage");
    const popupCloseBtn = document.getElementById("popupCloseBtn");
    const popupCloseXBtn = document.getElementById("popupCloseXBtn");

    function showPopup(title, message) {
      popupTitle.textContent = title;
      popupMessage.textContent = message;
      popupOverlay.classList.add("show");
    }

    popupCloseBtn.addEventListener("click", () => {
      popupOverlay.classList.remove("show");
    });

    popupCloseXBtn.addEventListener("click", () => {
      popupOverlay.classList.remove("show");
    });

    function setupToggle(btn, input) {
      btn.addEventListener("click", () => {
        if (input.type === "password") {
          input.type = "text";
          btn.textContent = "🙈";
        } else {
          input.type = "password";
          btn.textContent = "👁";
        }
      });
    }
    setupToggle(toggleCurrentPassBtn, currentPasswordInput);
    setupToggle(toggleNewPassBtn, newPasswordInput);
    setupToggle(toggleConfirmPassBtn, confirmPasswordInput);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "loginpage.html";
      } else {
        userEmail.innerText = user.email;
        userFullName.innerText = user.displayName || user.email.split('@')[0];

        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            userFullName.innerText = data.fullName || data.nickname || user.email.split('@')[0];
          } else {
            userFullName.innerText = user.email.split('@')[0];
          }
        } catch (error) {
          console.error("Error fetching profile:", error);
          userFullName.innerText = user.email.split('@')[0];
        }
      }
    });

    updatePasswordBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      const currentPassword = currentPasswordInput.value;
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        showPopup("SYSTEM ALERT", "Please fill in all password fields.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showPopup("SYSTEM ALERT", "New passwords do not match. Please check again.");
        return;
      }

      if (newPassword.length < 6) {
        showPopup("SYSTEM ALERT", "New password should be at least 6 characters long.");
        return;
      }

      try {
        updatePasswordBtn.innerText = "UPDATING...";
        updatePasswordBtn.disabled = true;

        const credential = EmailAuthProvider.credential(user.email, currentPassword);
        await reauthenticateWithCredential(user, credential);

        await updatePassword(user, newPassword);
        
        showPopup("SUCCESS", "Your password has been updated successfully.");
        
        currentPasswordInput.value = "";
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";

      } catch (error) {
        console.error("Error updating password:", error);
        if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          showPopup("SYSTEM ALERT", "The current password you entered is incorrect.");
        } else {
          showPopup("SYSTEM ALERT", "Failed to update password: " + error.message);
        }
      } finally {
        updatePasswordBtn.innerText = "Update Password";
        updatePasswordBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("loginpage.html");
      } catch (error) {
        console.error("Logout Error:", error);
      }
    });
  </script>
</body>
</html>
